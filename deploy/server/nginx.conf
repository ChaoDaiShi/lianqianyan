map $http_x_forwarded_proto $lianqianyan_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_real_ip $lianqianyan_real_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_for $lianqianyan_forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

upstream lianqianyan_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        proxy_pass http://lianqianyan_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $lianqianyan_real_ip;
        proxy_set_header X-Forwarded-For $lianqianyan_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lianqianyan_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /mcp {
        proxy_pass http://lianqianyan_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $lianqianyan_real_ip;
        proxy_set_header X-Forwarded-For $lianqianyan_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lianqianyan_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /mcp/ {
        proxy_pass http://lianqianyan_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $lianqianyan_real_ip;
        proxy_set_header X-Forwarded-For $lianqianyan_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lianqianyan_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /local-live2d/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
